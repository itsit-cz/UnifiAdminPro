services:
  unifi-access-admin:
    build: .
    image: unifiadminpro:local
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      UA_HOST: ${UA_HOST}
      UA_TOKEN: ${UA_TOKEN}
      UA_VERIFY_TLS: ${UA_VERIFY_TLS:-false}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - uaadmin-data:/app/data

volumes:
  uaadmin-data:
