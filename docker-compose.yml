# Žádné proměnné prostředí – vše se nastaví v průvodci instalací v prohlížeči.
# Instalační kód najdete v logu kontejneru po prvním spuštění.
services:
  unifiadminpro:
    build: .
    image: unifiadminpro:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - data:/app/data   # konfigurace (šifrovaná tajemství), audit
      - keys:/app/keys   # šifrovací klíč – zálohovat odděleně od data

volumes:
  data:
  keys:
