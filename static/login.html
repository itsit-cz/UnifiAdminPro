<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SyncPro – přihlášení</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="narrow form" style="max-width:380px;margin-top:12vh">
  <div class="card">
    <h2>🔐 SyncPro</h2>
    <form onsubmit="login(event)">
      <label>Uživatelské jméno</label><input id="user" autocomplete="username" autofocus>
      <label>Heslo</label><input id="pw" type="password" autocomplete="current-password">
      <div class="foot"><button class="btn primary">Přihlásit</button></div>
      <div class="err" id="err"></div>
    </form>
  </div>
</div>
<script>
async function login(e) {
  e.preventDefault();
  const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({user: user.value, password: pw.value})});
  if (r.ok) location.href = '/';
  else document.getElementById('err').textContent = (await r.json().catch(() => ({}))).detail || 'Chyba přihlášení';
}
</script>
</body>
</html>
